name: test

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `.env.test` is gitignored, so these values are not available in CI unless we
# define them here. They mirror `.env.test` exactly and are non-sensitive
# test-only defaults (a throwaway JWT key, dummy osu! client creds, localhost
# infra). app.config.Config requires JWT_SECRET_KEY at import time.
env:
  ENV: test
  DEBUG: "true"
  DISABLE_SECURITY: "false"
  BASE_URL: http://localhost:3000
  JWT_SECRET_KEY: kNHbFZhuWsVyOAITKBUbJCMtDUs4ODFx
  JWT_ALGORITHM: HS256
  OSU_CLIENT_ID: test-client-id
  OSU_CLIENT_SECRET: test-client-secret
  POSTGRESQL_HOST: localhost
  POSTGRESQL_PORT: 5432
  POSTGRESQL_USERNAME: postgres
  POSTGRESQL_PASSWORD: postgres
  POSTGRESQL_DATABASE: graveboards_test
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  REDIS_DB: "15"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run mypy app api main.py manage.py migrate.py

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: ENV=test uv run pytest -m unit -n auto --no-cov -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graveboards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: ENV=test GRAVEBOARDS_CLEAR_SPEC_CACHE=1 uv run pytest -m integration -n 4 --no-cov -q

  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graveboards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: ENV=test GRAVEBOARDS_CLEAR_SPEC_CACHE=1 uv run pytest -m "unit or integration" --cov=app --cov=api --cov-report=xml --cov-fail-under=70 -q
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
