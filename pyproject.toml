[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graveboards-backend"
version = "0.1.0"
description = "Backend service for Graveboards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.0",
    "connexion[swagger-ui,uvicorn]>=3.3.0",
    "cryptography>=46.0.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "structlog>=24.1.0",
    "prometheus_client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=app",
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: fast tests that do not need network, Redis, or PostgreSQL",
    "integration: tests that need local infrastructure such as Redis or Postgres",
    "e2e: tests that exercise the ASGI app through Connexion routing",
    "security: tests for auth, authorization, token, API-key, or regex safety behavior",
    "slow: tests that are intentionally slower than the default suite",
    "search: tests that exercise the search engine with queries",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade (modernize syntax)
    "B",      # bugbear
    "SIM",    # simplify
    "T20",    # no print
]
ignore = [
    "E501",   # line too long (ruff format handles this)
    "PLR",    # too many methods/arguments (not enforced)
    "B028",   # no explicit `stacklevel` keyword argument (not critical)
    "F403",   # star imports (intentional for re-exports)
    "F405",   # undefined names from star imports (intentional)
    "SIM102", # nested if statements (style preference)
    "SIM117", # nested with statements (style preference)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "api", "tests"]
known-third-party = ["alembic"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
sections = [
    ["future", "__future__"],
    ["standard-library"],
    ["third-party"],
    ["first-party", "app", "api", "tests"],
    ["local-folder"]
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "S"]
"manage.py" = ["S"]
"app/manage/*" = ["S", "T20"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_equality = true
mypy_path = "app"
exclude = ["pyproject.toml", "alembic", "manage.py", "migrate.py"]
ignore_missing_imports = true
follow_imports = "skip"
