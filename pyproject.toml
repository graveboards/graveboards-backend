[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graveboards-backend"
dynamic = ["version"]
description = "Backend service for Graveboards"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Graveboards" },
]
keywords = [
    "osu",
    "beatmap",
    "leaderboard",
    "scores",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiofiles>=24.1",
    "alembic>=1.18.0",
    "authlib>=1.6.0",
    "brotli>=1.1",
    "connexion[swagger-ui,uvicorn]>=3.3.0",
    "cryptography>=46.0.0",
    "numpy>=2.0",
    "psycopg2-binary>=2.9.0",
    "PyJWT>=2.10.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "structlog>=24.1.0",
    "prometheus_client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "types-PyYAML",
    "types-Authlib",
    "types-aiofiles",
]
test = [
    "factory-boy>=3.3.1",
    "pytest-mock>=3.14.0",
    "pytest-env>=0.8.2",
]

[project.urls]
Homepage = "https://github.com/graveboards/graveboards"
Issues = "https://github.com/graveboards/graveboards/issues"

[project.scripts]
graveboards-manage = "app.manage:cli_main"

[tool.hatch.version]
path = "app/version.py"

[tool.hatch.build.targets.wheel]
packages = ["app", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=app",
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=70",
]
filterwarnings = [
    "ignore:.*jsonschema.*RefResolver is deprecated::connexion",
    "ignore:.*jsonschema.*RefResolutionError is deprecated::connexion",
    "ignore:.*iscoroutinefunction.*is deprecated",
]
markers = [
    "unit: fast tests that do not need network, Redis, or PostgreSQL",
    "integration: tests that need local infrastructure such as Redis or Postgres",
    "e2e: tests that exercise the ASGI app through Connexion routing",
    "security: tests for auth, authorization, token, API-key, or regex safety behavior",
    "slow: tests that are intentionally slower than the default suite",
    "search: tests that exercise the search engine with queries",
]

[tool.coverage.run]
source = ["app", "api"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
# Pinned to the supported floor, not the newest interpreter, so a
# 3.14-or-later idiom cannot slip in unnoticed.
target-version = "py314"
line-length = 100
src = ["app", "api", "tests"]
exclude = [
    "docs", # markdown prose; don't reformat code fences inside it
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
    "RUF",    # ruff-specific rules
    "PTH",    # prefer pathlib over os.path
    "PT",     # flake8-pytest-style
    "PIE",    # misc lint rules
    "PERF",   # perflint
    "TC",     # flake8-type-checking
    "RET",    # flake8-return
    "D",      # pydocstyle (google convention, configured below)
    "ARG",    # unused arguments
    "RSE",    # no redundant parentheses on bare raises
    "A",      # shadowed builtins
]
ignore = [
    "E501",   # line length is enforced by the formatter, not worth duplicating
    "D105",   # magic methods are named by their contract; __len__ needs no prose
    "D107",   # __init__ is documented in the class docstring, per google style
    "PLR",    # too many methods/arguments (not enforced)
    "B028",   # no explicit `stacklevel` keyword argument (not critical)
    "F403",   # star imports (intentional for re-exports)
    "F405",   # undefined names from star imports (intentional)
    "SIM102", # nested if statements (style preference)
    "SIM117", # nested with statements (style preference)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app", "api", "tests"]
known-third-party = ["alembic"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# PT011: pinning every ValueError to a match= string is brittle busywork
# for input-validation tests where the type alone is the contract.
# D: a test's name is its docstring, and hundreds of them do not need prose.
# ARG: test fixtures are stub implementations of an abstract signature, and
# ignoring an argument the contract requires them to accept is the norm.
# TC: schemas/models are pydantic/SQLAlchemy-heavy and imports are only used
# in type annotations; per-file TC silence is far less noisy than ~120 inline
# `# noqa: TC00X` comments.
# TC + D + ARG: test files use these imports in type annotations and fixtures.
"tests/*" = ["PT011", "PT028", "D", "ARG", "PLR", "S", "TC"]
"app/database/schemas/**" = ["TC"]
"app/database/models/**" = ["TC"]
"alembic/versions/**" = ["TC"]
"manage.py" = ["S"]
"app/manage/*" = ["S", "T20", "D", "TC"]

[tool.mypy]
python_version = "3.14"
files = ["app", "api"]
mypy_path = "app"
strict = true
warn_unused_configs = true
disallow_untyped_decorators = false
no_implicit_optional = true
exclude = ["pyproject.toml", "alembic"]

[[tool.mypy.overrides]]
module = ["connexion.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["authlib.integrations.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["authlib.oauth2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiofiles"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Subclasses untyped third-party types (authlib, connexion); misc errors from
# inability to verify subclass compatibility with Any-typed parents.
module = ["app.oauth", "app.exceptions", "app.patches.*"]
disable_error_code = "misc"
