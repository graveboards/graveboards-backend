[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graveboards-backend"
version = "0.1.0"
description = "Backend service for Graveboards"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Graveboards" },
]
keywords = [
    "osu",
    "beatmap",
    "leaderboard",
    "scores",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.18.0",
    "connexion[swagger-ui,uvicorn]>=3.3.0",
    "cryptography>=46.0.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.24.0",
    "rich>=13.0.0",
    "structlog>=24.1.0",
    "prometheus_client>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/graveboards/graveboards"
Issues = "https://github.com/graveboards/graveboards/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.16",
    "mypy>=1.14",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=app",
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: fast tests that do not need network, Redis, or PostgreSQL",
    "integration: tests that need local infrastructure such as Redis or Postgres",
    "e2e: tests that exercise the ASGI app through Connexion routing",
    "security: tests for auth, authorization, token, API-key, or regex safety behavior",
    "slow: tests that are intentionally slower than the default suite",
    "search: tests that exercise the search engine with queries",
]

[tool.ruff]
# Pinned to the supported floor, not the newest interpreter, so a
# 3.14-or-later idiom cannot slip in unnoticed.
target-version = "py314"
line-length = 100
src = ["app", "api", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
    "RUF",    # ruff-specific rules
    "PTH",    # prefer pathlib over os.path
    "PT",     # flake8-pytest-style
    "PIE",    # misc lint rules
    "PERF",   # perflint
    "TC",     # flake8-type-checking
    "RET",    # flake8-return
    "D",      # pydocstyle (numpy convention, configured below)
    "ARG",    # unused arguments
    "RSE",    # no redundant parentheses on bare raises
    "A",      # shadowed builtins
]
ignore = [
    "E501",   # line length is enforced by the formatter, not worth duplicating
    "D105",   # magic methods are named by their contract; __len__ needs no prose
    "D107",   # __init__ is documented in the class docstring, per numpy style
    "PLR",    # too many methods/arguments (not enforced)
    "B028",   # no explicit `stacklevel` keyword argument (not critical)
    "F403",   # star imports (intentional for re-exports)
    "F405",   # undefined names from star imports (intentional)
    "SIM102", # nested if statements (style preference)
    "SIM117", # nested with statements (style preference)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["app", "api", "tests"]
known-third-party = ["alembic"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# PT011: pinning every ValueError to a match= string is brittle busywork
# for input-validation tests where the type alone is the contract.
# D: a test's name is its docstring, and hundreds of them do not need prose.
# ARG: test fixtures are stub implementations of an abstract signature, and
# ignoring an argument the contract requires them to accept is the norm.
"tests/*" = ["PT011", "D", "ARG", "PLR", "S"]
"manage.py" = ["S"]
"app/manage/*" = ["S", "T20", "D"]

[tool.mypy]
python_version = "3.14"
files = ["app", "api"]
mypy_path = "app"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
show_error_codes = true
no_implicit_optional = true
exclude = ["pyproject.toml", "alembic", "manage.py", "migrate.py"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["connexion.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Bodies are still checked (check_untyped_defs, inherited from strict) but
# tests aren't required to annotate every `def test_...(): ...`.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
